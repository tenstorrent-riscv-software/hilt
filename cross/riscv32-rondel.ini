# Meson cross file for the Atlantis Rondel RCPU (RV32IMAFDC + Zb*/Zc*/Zic*).
#

[binaries]
c = 'riscv64-unknown-elf-gcc'
ar = 'riscv64-unknown-elf-ar'
objcopy = 'riscv64-unknown-elf-objcopy'
objdump = 'riscv64-unknown-elf-objdump'
size = 'riscv64-unknown-elf-size'
strip = 'riscv64-unknown-elf-strip'

[host_machine]
system = 'none'
kernel = 'none'
cpu_family = 'riscv32'
cpu = 'rondel'
endian = 'little'

[constants]
arch_args = ['-march=rv32imafdc_zicbom_zicntr_zicond_zicsr_zifencei_zihpm_zcb_zba_zbb_zbc_zbs', '-mabi=ilp32d', '-mcmodel=medlow']

[built-in options]
c_args = arch_args + ['-ffunction-sections', '-fdata-sections', '-fno-common']
# Everything lives in one RAM region (SRAM), so a single RWX segment is expected.
c_link_args = arch_args + ['-nostdlib', '-Wl,--gc-sections', '-Wl,--no-warn-rwx-segments']
