name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

# Read-only by default. Only the release job below gets a write token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-unknown-elf ninja-build python3 pipx \
            u-boot-tools device-tree-compiler python3-libfdt
          pipx install 'meson>=1.4'
          # binman, for the placeholder platform-fw FIT; it uses apt's libfdt
          pipx install --system-site-packages binary-manager
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: meson setup build --cross-file cross/riscv32-rondel.ini

      - name: Build
        run: ninja -C build

      - name: Summarise
        run: |
          riscv64-unknown-elf-size build/hilt.elf build/hilt-rom.elf
          ls -l build/hilt.bin build/hilt-rom.bin

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: hilt-images
          path: |
            build/hilt.elf
            build/hilt.bin
            build/hilt.map
            build/hilt-rom.elf
            build/hilt-rom.bin
            build/hilt-rom.map
          if-no-files-found: error

  # On a published release, attach the images the build job produced from the
  # release tag. The job just downloads the artifacts and uploads them.
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: hilt-images
          path: images

      - name: Attach images to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        working-directory: images
        run: |
          sha256sum hilt.elf hilt.bin hilt-rom.elf hilt-rom.bin \
            | tee -a "$GITHUB_STEP_SUMMARY"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            hilt.elf hilt.bin hilt-rom.elf hilt-rom.bin
