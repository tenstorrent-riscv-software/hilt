name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-unknown-elf ninja-build python3 pipx
          pipx install 'meson>=1.4'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: meson setup build --cross-file cross/riscv32-rondel.ini

      - name: Build
        run: ninja -C build

      - name: Summarise
        run: |
          riscv64-unknown-elf-size build/hilt.elf build/hilt-rom.elf
          ls -l build/hilt.bin build/hilt-rom.bin build/hilt.simg build/hilt-nor.img

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: hilt-images
          path: |
            build/hilt.elf
            build/hilt.bin
            build/hilt.map
            build/hilt.simg
            build/hilt-nor.img
            build/hilt-rom.elf
            build/hilt-rom.bin
            build/hilt-rom.map
          if-no-files-found: error
